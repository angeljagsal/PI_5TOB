          <input class="p-3 ps-3 rounded-full w-full focus:outline-none text-sm" type="text" placeholder="Where to?">
          <img class="w-4 justify-self-end mr-3 cursor-pointer" src="Public/img/search.svg" alt="Search Icon">
      </div>
      <div class="flex justify-center col-span-1">
          <button>
              <img src="Public/img/adjustments.svg" alt="Settings Icon">
          </button>
      </div>
  </div>
  <hr class="border border-gray-300 mt-5 text-black">
</div>

<!-- Main Content Area for Cards with Scroll -->

<!-- Post bubble -->
<div class="addPost fixed bottom-20 right-4">
  <div class="h-14 w-14 rounded-full flex items-center justify-center cursor-pointer">
    <img class="max-h-full w-full" src="Public/img/add.svg">
  </div>
</div>

<!-- Lower Navbar - Fixed at the bottom -->
<nav class="fixed bottom-0 left-0 right-0 w-full h-16 bg-white shadow-inner rounded-t-lg z-10">
  <div class="flex justify-center items-center h-full">
      <div class="homeIcon w-1/4 flex flex-col items-center justify-center">
          <img class="w-6 cursor-pointer" src="Public/img/home.svg" alt="Home Icon">
      </div>
      <div class="likedIcon w-1/4 flex flex-col items-center justify-center">
          <img class="w-6 cursor-pointer opacity-30" src="Public/img/heart.svg" alt="Liked Icon">
      </div>
      <div class="mapIcon w-1/4 flex flex-col items-center justify-center">
          <img class="w-6 cursor-pointer opacity-30" src="Public/img/map.svg" alt="Map Icon">
      </div>
      <div class="userIcon w-1/4 flex flex-col items-center justify-center">
          <img class="w-6 cursor-pointer opacity-30" src="Public/img/user.svg" alt="User Icon">
      </div>
  </div>
</nav>

<script src="/www/Controllers/postController.js"></script>

<script>
  // Cargar los posts al cambiar la vista
  loadPosts();

  // Opciones de cambio de vistas
  document.querySelector('.addPost').addEventListener('click', function() {
    LoadPartialView('create_post', document.querySelector('.app'))
  })
  document.querySelector('.likedIcon').addEventListener('click', function() {
    LoadPartialView('liked', document.querySelector('.app'))
  })
  document.querySelector('.mapIcon').addEventListener('click', function() {
    LoadPartialView('register', document.querySelector('.app'))
  })
  document.querySelector('.userIcon').addEventListener('click', function() {
    LoadPartialView('userprofile', document.querySelector('.app'))
  })
</script>

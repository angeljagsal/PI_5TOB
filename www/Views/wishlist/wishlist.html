<div id="loader" class="bg-white h-screen w-screen fixed top-0 left-0 z-50">
  <div class="flex justify-center items-center h-full">
    <div class="loader"></div>
  </div>
</div>

<div id="upperNav" class="bg-white fixed top-0 left-0 right-0 z-10 mx-8 pt-8">
  <!-- TOP BAR -->
  <div class="grid grid-cols-3 ">
    <div class="arrowBack col-span-1 justify-self-start bg-black w-fit rounded py-1 p-0.5 pe-1 cursor-pointer">
      <svg class="w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </div>
    <div class="col-span-1 flex justify-center items-center m-0 p-0">
      <h1 class="text-xl text-gray-800 font-semibold">Wishlist</h1>
    </div>
    <div class="col-span-1 justify-self-end w-fit rounded py-1 p-0.5 pe-1 cursor-pointer">
      <img class="w-6" src="../../Public/img/search.svg" alt="">
    </div>
  </div>
  <hr class="border border-gray-300 mt-6 mb-6 text-black">
</div>

<!-- All liked posts are shown here, using js -->
<div class="userLikesArea mt-28 mb-20" id="userLikesArea">
  <!-- Cards are displayed here -->
</div>

<nav id="lowerNav" class="fixed bottom-0 left-0 right-0 w-full h-16 bg-white shadow-inner rounded-t-lg z-10">
  <div class="flex justify-center items-center h-full">
    <div class="homeIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/home.svg" alt="Home Icon">
    </div>
    <div class="likedIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer" src="Public/img/heart.svg" alt="Liked Icon">
    </div>
    <div class="toolsIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/briefcase.svg" alt="Map Icon">
    </div>
    <div class="userIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/user.svg" alt="User Icon">
    </div>
  </div>
</nav>

<!-- Post information (initially hidden) -->
<div id="post" class="hidden fixed inset-0 bg-black bg-opacity-50 z-40">
  <div class="relative h-full w-full">
    <div id="arrowBack" class="absolute arrowBack col-span-1 bg-black w-fit rounded py-1 p-0.5 pe-1 cursor-pointer ms-4 mt-4">
      <svg class="w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </div>
    <div id="bgImg" class="w-full h-96 bg-cover bg-center"></div>
    <div id="tripInfo" class="absolute bottom-0 w-full h-[calc(100%-18rem)] bg-gray-100 rounded-t-3xl z-10">
      <div class="mt-6 mx-6">
        <h1 id="title" class="text-2xl font-semibold"></h1>
        <div class="flex items-center space-x-2">
          <h1 id="price" class="text-3xl font-semibold"></h1>
          <p class="text-xl text-gray-500">$ / person</p>
        </div>
        <h2 class="mt-6 mb-3 text-xl font-semibold">Description</h2>
        <div id="desc" class="text-gray-500 w-full"></div>
        <h2 class="mt-10 mb-3 text-xl font-semibold">Post created by</h2>
        <div class="flex items-center">
          <div id="userImg" class="w-8 h-8 bg-cover bg-center rounded-full"
            style="background-image: url('Public/img/newyork.jpg');"></div>
          <p id="creator" class="ml-2"></p>
        </div>
        <button class="w-full mt-6 p-3 bg-green-500 text-white font-bold rounded-lg">CONTACT US!</button>
      </div>
    </div>
  </div>
</div>

<script src="../Controllers/userControllers.js"></script>

<script>
  // Manage users without account
  var userId = getLocalStorageValue("userId");
  if(!userId) {
    alert('Log in to add your favorite posts to your wishlist!')
    LoadPartialView('user/login', document.querySelector('.app'))
  }

  // Load all posts a user has liked
  loadUserLikes();

  // View change functionality
  document.querySelector('.arrowBack').addEventListener('click', function () {
    LoadPartialView('homepage/homepage', document.querySelector('.app'))
  })
  document.querySelector('.homeIcon').addEventListener('click', function () {
    LoadPartialView('homepage/homepage', document.querySelector('.app'))
  })
  document.querySelector('.toolsIcon').addEventListener('click', function () {
    LoadPartialView('tools/travel_tools', document.querySelector('.app'))
  })
  document.querySelector('.userIcon').addEventListener('click', function () {
    LoadPartialView('profile/userprofile', document.querySelector('.app'))
  })

  // Functionality for back arrow
  document.getElementById('arrowBack').addEventListener('click', function () {
    document.getElementById('post').classList.add('hidden');
    document.getElementById('lowerNav').classList.remove('hidden');
    document.getElementById('upperNav').classList.remove('hidden');
  });
</script>

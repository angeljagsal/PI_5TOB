<div class="bg-white fixed top-0 left-0 right-0 z-10 mx-8 pt-8">
  <!-- TOP BAR -->
  <div class="grid grid-cols-3 ">
    <div class="arrowBack col-span-1 justify-self-start bg-black w-fit rounded py-1 p-0.5 pe-1 cursor-pointer">
      <svg class="w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </div>
    <div class="col-span-1 flex justify-center items-center m-0 p-0">
      <h1 class="text-xl text-gray-800 font-semibold">Wishlist</h1>
    </div>
    <div class="col-span-1 justify-self-end w-fit rounded py-1 p-0.5 pe-1 cursor-pointer">
      <img class="w-6" src="../../Public/img/search.svg" alt="">
    </div>
  </div>
  <hr class="border border-gray-300 mt-6 mb-6 text-black">
</div>

<!-- All liked posts are shown here, using js -->
<div class="userLikesArea mt-28 mb-20" id="userLikesArea">
  <!-- Cards are displayed here -->
</div>

<nav class="fixed bottom-0 left-0 right-0 w-full h-16 bg-white shadow-inner rounded-t-lg z-50">
  <div class="flex justify-center items-center h-full">
    <div class="homeIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/home.svg" alt="Home Icon">
    </div>
    <div class="likedIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer" src="Public/img/heart.svg" alt="Liked Icon">
    </div>
    <div class="mapIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/map.svg" alt="Map Icon">
    </div>
    <div class="userIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/user.svg" alt="User Icon">
    </div>
  </div>
</nav>

<script src="../Controllers/userControllers.js"></script>

<script>
  // Manage users without account
  var userId = getLocalStorageValue("userId");
  if(!userId) {
    alert('Log in to add your favorite posts to your wishlist!')
    LoadPartialView('user/login', document.querySelector('.app'))
  }

  // Load all posts a user has liked
  loadUserLikes();

  // View change functionality
  document.querySelector('.arrowBack').addEventListener('click', function () {
    LoadPartialView('homepage/homepage', document.querySelector('.app'))
  })
  document.querySelector('.homeIcon').addEventListener('click', function () {
    LoadPartialView('homepage/homepage', document.querySelector('.app'))
  })
  document.querySelector('.mapIcon').addEventListener('click', function () {
    LoadPartialView('map/map', document.querySelector('.app'))
  })
  document.querySelector('.userIcon').addEventListener('click', function () {
    LoadPartialView('profile/userprofile', document.querySelector('.app'))
  })
</script>

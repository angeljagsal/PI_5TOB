  <div class="flex justify-center items-center h-full">
    <div class="loader"></div>
  </div>
</div>

<div class="bg-white fixed top-0 left-0 right-0 z-10 mx-8 pt-8">
  <!-- TOP BAR -->
  <div class="grid grid-cols-3 ">
    <div class="arrowBack col-span-1 justify-self-start bg-black w-fit rounded py-1 p-0.5 pe-1 cursor-pointer">
      <svg class="w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </div>
    <div class="col-span-1 flex justify-center items-center m-0 p-0">
      <h1 class="text-xl text-gray-800 font-semibold">My posts</h1>
    </div>
    <div class="col-span-1 justify-self-end w-fit rounded py-1 p-0.5 pe-1 cursor-pointer">
      <img class="w-6" src="../../Public/img/search.svg" alt="">
    </div>
  </div>
  <hr class="border border-gray-300 mt-6 mb-6 text-black">
</div>

<!-- All posts are shown here, using js -->
<div class="userPostsArea mt-28 mb-20" id="userPostsArea">
  <!-- Cards are displayed here -->
</div>

<!-- Modal for post editing -->
<div id="modalEdit" tabindex="-1" aria-hidden="true"
  class="overflow-y-auto overflow-x-hidden fixed top-0 right-0 left-0 z-50 flex justify-center items-center w-full h-full bg-black bg-opacity-50">
  <div class="relative p-4 w-full max-w-md max-h-full">
    <!-- Modal content -->
    <div class="relative bg-white rounded-lg shadow">
      <!-- Modal header -->
      <div class="flex items-center justify-between p-4 md:p-5 border-b border-gray-300 rounded-t bg-white">
        <h3 class="text-lg font-semibold text-gray-900">
          Edit Post
        </h3>
        <button type="button" onclick="closeModalEdit()"
          class="text-gray-900 bg-transparent hover:bg-gray-200 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center"
          data-modal-toggle="crud-modal">
          <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
          <span class="sr-only">Close modal</span>
        </button>
      </div>
      <!-- Modal body -->
      <form id="editPostForm" class="p-4 md:p-5 bg-white">
        <div class="grid gap-4 mb-4 grid-cols-2">
          <div class="col-span-2">
            <label for="name" class="block mb-2 text-sm font-medium text-gray-900">Title</label>
            <input type="text" name="title" id="title"
              class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5"
              placeholder="Title" required="">
          </div>
          <div class="col-span-2 sm:col-span-1">
            <label for="price" class="block mb-2 text-sm font-medium text-gray-900">Price</label>
            <input type="number" name="price" id="price"
              class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5"
              placeholder="$2999" required="">
          </div>
          <div class="col-span-2">
            <label for="description" class="block mb-2 text-sm font-medium text-gray-900">Description</label>
            <textarea id="desc" rows="4" maxlength="250"
              class="block p-2.5 w-full text-sm text-gray-900 bg-gray-100 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500"
              placeholder="Write product description here"></textarea>
          </div>
        </div>
        <button type="submit"
          class="text-white inline-flex items-center bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
          Edit post
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Modal for post deletion confirmation -->
<div id="modalDelete" tabindex="-1" aria-hidden="true"
  class="overflow-x-hidden fixed inset-0 z-50 flex justify-center items-center w-full h-full bg-black bg-opacity-50">
  <div class="relative p-4 w-full max-w-md md:h-auto">
    <!-- Modal content -->
    <div class="relative p-4 text-center bg-white rounded-lg shadow sm:p-5">
      <button type="button" onclick="closeModalDelete()"
        class="text-gray-900 absolute top-2.5 right-2.5 bg-transparent hover:bg-gray-200 rounded-lg text-sm p-1.5 ml-auto inline-flex items-center"
        data-modal-toggle="deleteModal">
        <img src="Public/img/close.svg" alt="">
        <span class="sr-only">Close modal</span>
      </button>
      <img class="text-gray-900 w-11 h-11 mb-3.5 mx-auto" src="Public/img/trash-bin.svg" alt="">
      <p class="mb-4 text-gray-900">Are you sure you want to delete this item?</p>
      <div class="flex justify-center items-center space-x-4">
        <button onclick="closeModalDelete()" type="button"
          class="py-2 px-3 text-sm font-medium text-gray-900 bg-white rounded-lg border border-gray-300 hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-primary-300">
          No, cancel
        </button>
        <button id="deletePostConfirmation" type="submit"
          class="py-2 px-3 text-sm font-medium text-center text-white bg-red-600 rounded-lg hover:bg-red-700 focus:ring-4 focus:outline-none">
          Yes, I'm sure
        </button>
      </div>
    </div>
  </div>
</div>

<script src="../../Controllers/postController.js"></script>

<script>
  loadUserPosts();

  // Arrow back to home
  document.querySelector('.arrowBack').addEventListener('click', function () {
    LoadPartialView('profile/userprofile', document.querySelector('.app'))
  })

  // Modal for post edition handling
  function openModalEdit(postId, title, desc, price) {
    document.getElementById('modalEdit').classList.remove('hidden');
    document.getElementById('title').value = title;
    document.getElementById('desc').value = desc;
    document.getElementById('price').value = price;

    const editForm = document.getElementById('editPostForm');
    editForm.onsubmit = function (event) {
      event.preventDefault();

      const updatedTitle = document.getElementById('title').value;
      const updatedPrice = document.getElementById('price').value;
      const updatedDesc = document.getElementById('desc').value;

      const formData = {
        postId: postId,
        title: updatedTitle,
        price: updatedPrice,
        desc: updatedDesc
      };

      editPost(formData);
      closeModalEdit();
    };
  }

  // Handle double display error
  document.getElementById('modalEdit').classList.add('hidden');


  function closeModalEdit() {
    document.getElementById('modalEdit').classList.add('hidden');
  }

  // Handle double display error
  document.getElementById('modalDelete').classList.add('hidden');

  // Modal for post elimination confirmation handling
  function openModalDelete(postId) {
    document.getElementById('modalDelete').classList.remove('hidden');

    document.getElementById('deletePostConfirmation').addEventListener('click', function (event) {
      event.preventDefault();

      deletePost(postId);
      closeModalDelete();
    })
  }

  function closeModalDelete() {
    document.getElementById('modalDelete').classList.add('hidden');
  }

</script>

<script src="../Public/js/index.js"></script>

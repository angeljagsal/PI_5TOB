<div class="m-8">
  <!-- TOP BAR -->
  <div class="grid grid-cols-3">
    <div class="arrowBack col-span-1 bg-black w-fit rounded py-1 p-0.5 pe-1 cursor-pointer">
      <svg class="w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </div>
    <div class="flex justify-center items-center m-0 p-0 col-span-1">
      <h1 class="text-xl text-gray-800 font-semibold">Profile</h1>
    </div>
  </div>
  <hr class="border border-gray-300 mt-6 mb-6 text-black">
  <!-- User information -->
  <div class="grid grid-cols-3 items-center">
    <!-- Image -->
    <div class="pfp col-span-1 relative cursor-pointer w-28 h-28">
      <img class="rounded-full w-full h-full object-cover shadow-md" src="" id="userImage">
      <input type="file" id="fileInput" class="hidden">
    </div>
    <!-- Information -->
    <div class="col-span-2 ms-5 flex flex-col items-start">
      <div>
        <p id="displayUsername" class="text-lg font-semibold">Error</p>
        <p class="text-xs text-gray-500">Reynosa, Tamps</p>
      </div>
      <button class="border-2 px-2 py-1 mt-2 text-gray-700 rounded-xl text-xs">Edit profile</button>
    </div>
  </div>
  <!-- Profile content -->
  <div class="mt-12">
    <p class="mb-6 text-sm text-gray-600">My stuff</p>
    <!-- Wishlist container -->
    <div class="wishlist grid grid-cols-12 mb-3 cursor-pointer">
      <div class="col-span-2 ms-1">
        <div class="bg-gray-100 w-fit p-1 rounded-lg">
          <img class="w-6" src="Public/img/heart.svg" alt="">
        </div>
      </div>
      <div class="col-span-9 flex items-center">
        <p>Wishlist</p>
      </div>
      <div class="col-span-1 flex items-center">
        <img class="w-5" src="Public/img/rightArrow.svg" alt="">
      </div>
    </div>
    <!-- Manage posts container -->
    <div class="managePost grid grid-cols-12 mb-3 cursor-pointer">
      <div class="col-span-2 ms-1">
        <div class="bg-gray-100 w-fit p-1 rounded-lg">
          <img class="w-6" src="Public/img/userEdit.svg" alt="">
        </div>
      </div>
      <div class="col-span-9 flex items-center">
        <p>Manage posts</p>
      </div>
      <div class="col-span-1 flex items-center">
        <img class="w-5" src="Public/img/rightArrow.svg" alt="">
      </div>
    </div>
    <!-- Preferences container -->
    <div class="grid grid-cols-12 mb-3 cursor-pointer">
      <div class="col-span-2 ms-1">
        <div class="bg-gray-100 w-fit p-1 rounded-lg">
          <img class="w-6" src="Public/img/gear.svg" alt="">
        </div>
      </div>
      <div class="col-span-9 flex items-center">
        <p>Preferences</p>
      </div>
      <div class="col-span-1 flex items-center">
        <img class="w-5" src="Public/img/rightArrow.svg" alt="">
      </div>
    </div>
  </div>
  <!-- ADDRESS SECTION -->
  <div class="mt-6">
    <p class="mb-6 text-sm text-gray-600">Address</p>
    <!-- BUTTON -->
    <div class="grid grid-cols-12">
      <div class="col-span-2 ms-1">
        <div class="bg-gray-100 w-fit p-1 rounded-lg">
          <img class="w-6" src="Public/img/map.svg" alt="">
        </div>
      </div>
      <div class="col-span-10 flex items-center">
        <p>Angel Aguilar</p>
        <p class="text text-sm text-gray-600 ms-3">899 963 3165</p>
      </div>
    </div>
    <div class="flex w-10/12">
      <p class="text text-sm text-gray-600 ms-14">Matamoros #315, Jarachina Sur #88736</p>
    </div>
  </div>
</div>

<!-- Logout button -->
<div class="mt-6 mx-8">
  <p class="mb-6 text-sm text-gray-600">Options</p>
  <!-- Wishlist container -->
  <div id="logOutBtn" class="grid grid-cols-12 mb-3 cursor-pointer">
    <div class="col-span-2 ms-1">
      <div class="bg-gray-100 w-fit p-1 rounded-lg">
        <img class="w-6" src="Public/img/logout.svg" alt="">
      </div>
    </div>
    <div class="col-span-9 flex items-center text-red-600 font-semibold">
      <p>Logout</p>
    </div>
    <div class="col-span-1 flex items-center">
      <img class="w-5" src="Public/img/rightArrow.svg" alt="">
    </div>
  </div>
</div>

<!-- Lower navbar -->
<nav class="absolute bottom-0 right-0 left-0 w-full overflow-hidden h-16 bg-white shadow-inner rounded-t-lg">
  <div class="flex justify-center items-center mt-5">
    <div class="homeIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/home.svg" alt="">
    </div>
    <div class="likedIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/heart.svg" alt="">
    </div>
    <div class="mapIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/map.svg" alt="">
    </div>
    <div class="userIcon w-1/4 flex flex-col items-center justify-center">
      <img class="w-6 cursor-pointer" src="Public/img/user.svg" alt="">
    </div>
  </div>
</nav>

<script src="../../Controllers/userControllers.js "></script>

<script>
  var userId = getLocalStorageValue("userId");
  if (!userId) {
    alert('Log in to manage your profile!')
    LoadPartialView('user/login', document.querySelector('.app'))
  }

  document.getElementById('userImage').addEventListener('click', function () {
    document.getElementById('fileInput').click();
  });

  var userId = getLocalStorageValue("userId");
  var newImage = null;

  document.getElementById('fileInput').addEventListener('change', function (event) {
    const file = event.target.files[0];
    if (file) {
      newImage = file;
      changeProfileImg(userId, newImage);
    }
  });

  // Display user picture
  document.getElementById('userImage').src = getLocalStorageValue("profileImg")

  // Display username in top of user profile
  document.getElementById('displayUsername').textContent = getLocalStorageValue("username");

  // Arrow back to home
  document.querySelector('.arrowBack').addEventListener('click', function () {
    LoadPartialView('homepage/homepage', document.querySelector('.app'))
  })

  // View change functionality
  document.querySelector('.managePost').addEventListener('click', function () {
    LoadPartialView('profile/user_posts', document.querySelector('.app'))
  })
  document.querySelector('.wishlist').addEventListener('click', function () {
    LoadPartialView('wishlist/wishlist', document.querySelector('.app'))
  })
  document.querySelector('.homeIcon').addEventListener('click', function () {
    LoadPartialView('homepage/homepage', document.querySelector('.app'))
  })
  document.querySelector('.likedIcon').addEventListener('click', function () {
    LoadPartialView('wishlist/wishlist', document.querySelector('.app'))
  })
  document.querySelector('.mapIcon').addEventListener('click', function () {
    LoadPartialView('map/map', document.querySelector('.app'))
  })

  // Log out button handling
  document.getElementById('logOutBtn').addEventListener('click', function () {
    logout();
    LoadPartialView('user/login', document.querySelector('.app'))
  })
</script>

<script src="../../Public/js/index.js"></script>

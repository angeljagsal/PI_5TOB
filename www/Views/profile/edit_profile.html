<div class="m-8 mt-10">
  <!-- TOP BAR -->
  <div class="grid grid-cols-3">
    <div class="arrowBack col-span-1 bg-black w-fit rounded py-1 p-0.5 pe-1 cursor-pointer">
      <svg class="w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </div>
    <div class="flex justify-center items-center m-0 p-0 col-span-1">
      <h1 class="text-xl text-gray-800 font-semibold">Edit profile</h1>
    </div>
  </div>
  <hr class="border border-gray-300 mt-6 mb-6 text-black">
  <!-- User information -->
  <div class="flex flex-col justify-center items-center">
    <!-- Image -->
    <div class="pfp relative cursor-pointer w-32 h-32 mb-3">
      <img id="userImage" class="rounded-full w-full h-full object-cover shadow-md" src="">
      <input type="file" id="fileInput" class="hidden">
      <div id="imgBtn" class="absolute bottom-2 right-2 bg-blue-600 rounded-full ">
        <img class="p-1" src="Public/img/pencil.svg" alt="">
      </div>
    </div>
    <!-- Information -->
    <div class="items-start">
      <p id="displayUsername" class="text-xl font-semibold">Error</p>
    </div>
  </div>
  <!-- Data form -->
  <div class="mt-6">
    <form class="grid grid-cols-1 gap-4">
      <div class="relative">
        <label for="username" class="text-sm font-semibold">Username</label>
        <input type="text" id="username" class="w-full border border-gray-300 rounded-md p-2 text-sm outline-none" required>
      </div>
      <div class="relative">
        <label for="email" class="text-sm font-semibold">Email</label>
        <input type="email" id="email" class="w-full border border-gray-300 rounded-md p-2 text-sm outline-none" required>
      </div>
      <div class="relative">
        <label for="password" class="text-sm font-semibold">Password</label>
        <input type="password" id="password" class="w-full border border-gray-300 rounded-md p-2 text-sm outline-none" placeholder="Introduce password to save changes" required>
      </div>
      <button id="saveBtn" type="submit" class="bg-blue-600 text-white font-semibold rounded-md p-2 text-base w-full">Save</button>
    </form>
  </div>
</div>

<!-- Logout button -->
<div class="mt-6 mx-8">
  <p class="mb-6 text-sm text-gray-600">Options</p>
  <!-- Wishlist container -->
  <div id="deleteAccBtn" class="grid grid-cols-12 mb-3 cursor-pointer bg-red-600/20 rounded-lg p-1">
    <div class="col-span-2 ms-1">
      <div class="w-fit p-1 rounded-lg">
        <img class="w-6" src="Public/img/exclamation.svg" alt="">
      </div>
    </div>
    <div class="col-span-9 flex items-center text-red-600 font-semibold">
      <p>Delete account</p>
    </div>
    <div class="col-span-1 flex items-center">
      <img class="w-5" src="Public/img/exitCaution.svg" alt="">
    </div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="relative z-10 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
  <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" aria-hidden="true"></div>
  <div class="fixed inset-0 z-10 flex items-center justify-center overflow-y-auto m-5">
    <div
      class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg">
      <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
        <div class="sm:flex sm:items-start">
          <div
            class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-red-100 sm:mx-0 sm:h-10 sm:w-10">
            <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
              aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
            </svg>
          </div>
          <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left">
            <h3 class="text-base font-semibold leading-6 text-gray-900" id="modal-title">Delete account</h3>
            <div class="mt-2">
              <p class="text-sm text-gray-500">Are you sure you want to delete your account? All of your data will
                be permanently removed. This action cannot be undone.</p>
            </div>
            <!-- Password input -->
            <div class="mt-4">
              <input id="delPass" type="password" id="password" class="w-full border border-gray-300 rounded-md p-2 text-sm outline-none text-center" placeholder="Introduce password to delete account" required>
            </div>
          </div>
        </div>
      </div>
      <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
        <button type="button" id="delete"
          class="inline-flex w-full justify-center rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-500 sm:ml-3 sm:w-auto">Delete</button>
        <button type="button" id="cancel"
          class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto">Cancel</button>
      </div>
    </div>
  </div>
</div>

<script src="../../Controllers/userControllers.js "></script>

<script>
  // Verify that user is logged in
  var userId = getLocalStorageValue("userId");
  if (!userId) {
    alert('Log in to manage your profile!')
    LoadPartialView('user/login', document.querySelector('.app'))
  }

  // Change profile image
  document.getElementById('userImage').addEventListener('click', function () {
    document.getElementById('fileInput').click();
  });
  document.getElementById('imgBtn').addEventListener('click', function () {
    document.getElementById('fileInput').click();
  });

  var userId = getLocalStorageValue("userId");
  var newImage = null;

  document.getElementById('fileInput').addEventListener('change', function (event) {
    const file = event.target.files[0];
    if (file) {
      newImage = file;
      document.getElementById('fileInput').disabled = true;
      document.getElementById('userImage').classList.add('opacity-20');
      changeProfileImg(userId, newImage);
    }
  });

  // Edit user data
  document.querySelector('form').addEventListener('submit', function (event) {
    event.preventDefault();
    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    editUser(userId, username, email, password);
  });

  // Disable submit button after submit
  document.querySelector('form').addEventListener('submit', function (event) {
    event.preventDefault();

    var formBtn = document.getElementById('saveBtn');
    formBtn.disabled = true;
    formBtn.innerText = 'Processing...';
  });

  // Delete account 
  document.getElementById('deleteAccBtn').addEventListener('click', function () {
    document.getElementById('modal').classList.remove('hidden');
  })
  document.getElementById('delete').addEventListener('click', function () {
    var password = document.getElementById('delPass').value;
    if(password == "") {
      alert('Please introduce your password to delete your account');
      return;
    }
    deleteUser(userId, password);

    var formBtn = document.getElementById('delete');
    formBtn.disabled = true;
    formBtn.innerText = 'Processing...';
  })
  document.getElementById('cancel').addEventListener('click', function () {
    document.getElementById('modal').classList.add('hidden');
  })

  // Display user data
  var userImg = document.getElementById('userImage');
  var profileImg = getLocalStorageValue("profileImg");

  if(profileImg == 'undefined') {
    userImg.src = "Public/img/default-user.webp";
  } else {
    userImg.src = getLocalStorageValue("profileImg");
  }

  document.getElementById('displayUsername').textContent = getLocalStorageValue("username");
  document.getElementById('username').value = getLocalStorageValue("username");
  document.getElementById('email').value = getLocalStorageValue("email");

  // Arrow back to home
  document.querySelector('.arrowBack').addEventListener('click', function () {
    LoadPartialView('profile/userprofile', document.querySelector('.app'))
  })
</script>

<script src="../../Public/js/index.js"></script>

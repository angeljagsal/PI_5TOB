<div class="m-8">
  <!-- Upper section -->
  <div class="flex items-center space-x-4">
    <div id="userImg" class="w-12 h-12 bg-cover bg-center rounded-full"
      style="background-image: url('Public/img/default-user.webp');"></div>
    <div class="flex flex-col">
      <p id="usernameUpper" class="text-sm text-gray-600">username's</p>
      <h1 class="text-xl text-gray-800 font-bold">tools</h1>
    </div>
  </div>
  <hr class="border border-gray-300 mt-6 mb-6 text-black">

  <!-- Title -->
  <h1 id="txth1"
    class="text-3xl font-semibold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-blue-900">
    Here you can find tools for your travels!
  </h1>


  <!-- Travel tools -->
  <div id="tools" class="shadow-xl rounded-3xl">
    <div class="grid grid-cols-2 gap-1 mt-8">
      <div class="col-span-1 w-full h-fit bg-gray-200 aspect-w-1 aspect-h-1 rounded-tl-3xl">
        <div id="translatorBtn" class="flex flex-col justify-center items-center h-full transition-transform duration-200 transform hover:scale-110 active:scale-95">
          <img class="w-12 pb-1" src="Public/img/language.svg" alt="">
          <p class="text-sm text-gray-600">Translator</p>
        </div>
      </div>
      <div class="col-span-1 w-full h-fit bg-gray-200 aspect-w-1 aspect-h-1 rounded-tr-3xl">
        <div id="currencyExchangerBtn" class="flex flex-col justify-center items-center h-full transition-transform duration-200 transform hover:scale-110 active:scale-95">
          <img class="w-12 pb-1" src="Public/img/wallet.svg" alt="">
          <p class="text-sm text-gray-600">Currency</p>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-1 mt-1">
      <div class="col-span-1 w-full h-fit bg-gray-200 aspect-w-1 aspect-h-1 rounded-bl-3xl">
        <div id="weatherBtn" class="flex flex-col justify-center items-center h-full transition-transform duration-200 transform hover:scale-110 active:scale-95">
          <img class="w-12 pb-1" src="Public/img/sun.svg" alt="">
          <p class="text-sm text-gray-600">Weather</p>
        </div>
      </div>
      <div class="col-span-1 w-full h-fit bg-gray-200 aspect-w-1 aspect-h-1 rounded-br-3xl">
        <div id="timeZoneBtn" class="flex flex-col justify-center items-center h-full transition-transform duration-200 transform hover:scale-110 active:scale-95">
          <img class="w-12 pb-1" src="Public/img/clock.svg" alt="">
          <p class="text-sm text-gray-600">Time zone</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Information card -->
  <div class="mt-4 p-6 flex items-center justify-center">
    <p class="text-gray-800 text-center text-lg font-semibold">
      Click on any of the icons above to get started!
    </p>
  </div>
</div>

<!-- Lower Navbar - Fixed at the bottom -->
<nav id="lowerNav" class="fixed bottom-0 left-0 right-0 w-full h-16 bg-white shadow-inner rounded-t-lg z-10">
  <div class="flex justify-center items-center h-full">
    <div class="homeIcon w-1/4 flex flex-col items-center justify-center transition-transform duration-200 transform hover:scale-105 active:scale-95">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/home.svg" alt="Home Icon">
    </div>
    <div class="likedIcon w-1/4 flex flex-col items-center justify-center transition-transform duration-200 transform hover:scale-105 active:scale-95">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/heart.svg" alt="Liked Icon">
    </div>
    <div class="toolsIcon w-1/4 flex flex-col items-center justify-center transition-transform duration-200 transform hover:scale-105 active:scale-95">
      <img class="w-6 cursor-pointer" src="Public/img/briefcase.svg" alt="Map Icon">
    </div>
    <div class="userIcon w-1/4 flex flex-col items-center justify-center transition-transform duration-200 transform hover:scale-105 active:scale-95">
      <img class="w-6 cursor-pointer opacity-30" src="Public/img/user.svg" alt="User Icon">
    </div>
  </div>
</nav>

<script>
  // Upper username and image
  var userImage = document.getElementById('userImg');
  var profileImg = getLocalStorageValue('profileImg');

  if (profileImg == 'undefined') {
    userImage.src = "Public/img/default-user.webp";
  } else {
    userImage.src = profileImg;
  }

  var username = getLocalStorageValue('username');
  var usernamePossessive = username.endsWith('s') ? username + "'" : username + "'s";
  document.getElementById('usernameUpper').innerHTML = usernamePossessive;

  // Buttons handling
  document.getElementById('translatorBtn').addEventListener('click', function () {
    LoadPartialView('tools/translator', document.querySelector('.app'));
  });

  document.getElementById('currencyExchangerBtn').addEventListener('click', function () {
    LoadPartialView('tools/currency_exchanger', document.querySelector('.app'));
  });
  document.getElementById('weatherBtn').addEventListener('click', function () {
    alert('Weather tool is not available yet!');
    // LoadPartialView('tools/currency_exchanger', document.querySelector('.app'));
  });
  document.getElementById('timeZoneBtn').addEventListener('click', function () {
    alert('Time zone tool is not available yet!');
    // LoadPartialView('tools/currency_exchanger', document.querySelector('.app'));
  });

  // Navbar icons
  document.querySelector('.homeIcon').addEventListener('click', function () {
    LoadPartialView('homepage/homepage', document.querySelector('.app'));
  });

  document.querySelector('.likedIcon').addEventListener('click', function () {
    LoadPartialView('wishlist/wishlist', document.querySelector('.app'));
  });

  document.querySelector('.userIcon').addEventListener('click', function () {
    LoadPartialView('profile/userprofile', document.querySelector('.app'));
  });
</script>

<div id="loader" class="bg-white h-svh w-svw">
  <div class="flex justify-center items-center h-svh w-svw">
    <div class="loader"></div>
  </div>
</div>

<div id="post" class="relative h-screen">
  <div class="absolute arrowBack col-span-1 bg-black w-fit rounded py-1 p-0.5 pe-1 cursor-pointer ms-4 mt-4">
    <svg class="w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
      stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
    </svg>
  </div>
  <div id="bgImg" class="w-full h-96 bg-cover bg-center"></div>
  <div id="tripInfo" class="absolute bottom-0 w-full h-[calc(100%-18rem)] bg-gray-100 rounded-t-3xl z-10">
    <div class="mt-6 mx-6">
      <h1 id="title" class="text-2xl font-semibold"></h1>
      <div class="flex items-center space-x-2">
        <h1 id="price" class="text-3xl font-semibold"></h1>
        <p class="text-xl text-gray-500">$ / person</p>
      </div>
      <h2 class="mt-6 mb-3 text-xl font-semibold">Description</h2>
      <div id="desc" class="text-gray-500 w-full"></div>
      <h2 class="mt-10 mb-3 text-xl font-semibold">Post created by</h2>
      <div class="flex items-center">
        <div id="userImg" class="w-8 h-8 bg-cover bg-center rounded-full"
          style="background-image: url('Public/img/newyork.jpg');"></div>
        <p id="creator" class="ml-2"></p>
      </div>
      <button class="w-full mt-6 p-3 bg-green-500 text-white font-bold rounded-lg">CONTACT US!</button>
    </div>
  </div>
</div>

<script src="../Controllers/postController.js"></script>

<script>
  // Loader
  document.addEventListener('PartialViewLoaded', function () {
    setTimeout(function () {
      var loader = document.getElementById('loader');
      if (loader) {
        loader.classList.add('hidden');
      }
    }, 500);
  });


  // Arrow back to home
  document.querySelector('.arrowBack').addEventListener('click', function () {
    LoadPartialView('homepage/homepage', document.querySelector('.app'))
  })
</script>
